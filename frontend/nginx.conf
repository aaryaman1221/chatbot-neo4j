# =============================================================================
# nginx.conf — SPA hosting + /api reverse proxy for the frontend image.
# Rendered from /etc/nginx/templates/default.conf.template by the nginx:alpine
# entrypoint; ${BACKEND_ORIGIN} is substituted from the environment.
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Forward API traffic to the backend (path is preserved: /api/health → /api/health).
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Single-page-app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
