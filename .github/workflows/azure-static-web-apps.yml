name: Deploy frontend (Static Web Apps)

# Builds the Vite app with VITE_API_BASE baked in, then uploads dist/ to the
# pre-created Static Web App using its deployment token (no Azure login needed).
#
# Repo VARIABLE:  VITE_API_BASE   (e.g. https://<backend-fqdn>/api)
# Repo SECRET:    AZURE_STATIC_WEB_APPS_API_TOKEN   (SWA deployment token)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/azure-static-web-apps.yml"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "frontend/dist"
          skip_app_build: true
          skip_api_build: true

  close-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
