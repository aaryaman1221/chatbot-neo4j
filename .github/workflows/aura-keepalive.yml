name: AuraDB keep-alive

# AuraDB Free auto-pauses after ~3 days with no connections. A daily no-op
# query keeps it warm so the deployed app never hits a paused instance.
# Requires repo secrets: NEO4J_URI, NEO4J_PASSWORD (and optionally NEO4J_USER).

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Neo4j
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python -m pip install --quiet 'neo4j>=5.20'
          python - <<'PY'
          import os
          from neo4j import GraphDatabase
          uri = os.environ["NEO4J_URI"]
          auth = (os.environ.get("NEO4J_USER") or "neo4j", os.environ["NEO4J_PASSWORD"])
          with GraphDatabase.driver(uri, auth=auth) as d:
              d.verify_connectivity()
              with d.session() as s:
                  n = s.run("MATCH (n) RETURN count(n) AS c").single()["c"]
          print(f"OK - {n} nodes")
          PY
